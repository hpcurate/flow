<!DOCTYPE html>
<html lang="en" class="tm-page">
<head>
  <meta charset="UTF-8">
  <title>FLOW timers</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="timers.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

<body>
  <div class="wrap" id="wrap"><div class="slot-pop" id="dock"></div></div>
