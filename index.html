<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e0e">
  <title>FLOW</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0e0e'/%3E%3Cpath d='M12 9v10.5a3 3 0 1 1-2-2.83V8l9-2v8.5a3 3 0 1 1-2-2.83V7z' fill='%23A78BFA'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    :root {
      --bg:#0e0e0e; --s1:#161616; --s2:#1e1e1e; --bd:#272727;
      --y:#A78BFA; --yd:rgba(167,139,250,.13); --yb:rgba(167,139,250,.25);
      --tx:#dedede; --mu:#4a4a4a;
      --gr:#5cdb7d; --re:#e06060;
      --mono:'JetBrains Mono','Courier New',monospace;
      --head:'Syne',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden}
    body{background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:14px;
         overscroll-behavior:none;height:100vh;user-select:none}
    ::-webkit-scrollbar{width:0;height:0;display:none}
    *{scrollbar-width:none}

    .wrap{display:flex;flex-direction:column;height:100vh;max-width:680px;margin:0 auto}

    /* ── Header ── */
    .top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:30px}
    .label{font:700 10px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin-bottom:9px}
    .logo{font:800 46px/1 var(--head);letter-spacing:-.02em}
    .logo em{color:var(--y);font-style:normal}
    .top-act{display:flex;gap:8px}
    .ghost-btn{background:var(--s1);border:1px solid var(--bd);border-radius:6px;color:var(--mu);
               font:400 11px/1 var(--mono);letter-spacing:.06em;padding:10px 14px;cursor:pointer;
               transition:all .12s;white-space:nowrap}
    .ghost-btn:hover{border-color:var(--y);color:var(--y)}
    .ghost-btn.toggled{border-color:var(--y);color:var(--y);background:var(--yd)}

    /* ── Now playing ── */
    .player{background:var(--s1);border:1px solid var(--bd);border-radius:10px;
            padding:22px 22px 20px;margin-bottom:14px}
    .np-label{font:700 9px/1 var(--head);letter-spacing:.15em;text-transform:uppercase;color:var(--mu);margin-bottom:12px}
    .np-title{font:700 18px/1.3 var(--head);letter-spacing:.01em;margin-bottom:3px;
              word-break:break-word;min-height:23px}
    .np-sub{font:400 11px/1 var(--mono);color:var(--mu);letter-spacing:.05em;margin-bottom:20px}
    .np-sub em{color:var(--y);font-style:normal}

    /* seek bar */
    .seek-wrap{display:flex;align-items:center;gap:11px;margin-bottom:18px}
    .time{font:400 10px/1 var(--mono);color:var(--mu);letter-spacing:.04em;min-width:48px;flex-shrink:0}
    .time.cur{text-align:right;color:var(--tx)}
    input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;
                      background:var(--bd);outline:none;cursor:pointer}
    input[type=range].seek{background:linear-gradient(var(--y),var(--y)) 0/var(--pct,0%) 100% no-repeat var(--bd)}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
            background:var(--y);cursor:pointer;border:none;box-shadow:0 0 0 3px var(--bg)}
    input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--y);
            cursor:pointer;border:none;box-shadow:0 0 0 3px var(--bg)}

    /* controls */
    .controls{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px}
    .ctrl{background:none;border:1px solid transparent;border-radius:8px;color:var(--mu);
          cursor:pointer;padding:9px;display:flex;align-items:center;justify-content:center;
          transition:all .12s}
    .ctrl:hover{color:var(--tx)}
    .ctrl svg{width:20px;height:20px;display:block}
    .ctrl.play{background:var(--y);color:#0e0e0e;width:52px;height:52px;border-radius:50%;margin:0 6px}
    .ctrl.play:hover{color:#0e0e0e;opacity:.88}
    .ctrl.play svg{width:24px;height:24px}
    .ctrl.toggled{color:var(--y)}
    .ctrl .badge{position:absolute;font:700 8px/1 var(--mono);transform:translate(11px,9px)}
    .ctrl.has-badge{position:relative}

    /* bottom row: volume */
    .vol-row{display:flex;align-items:center;gap:11px}
    .vol-row svg{width:16px;height:16px;color:var(--mu);flex-shrink:0}
    .vol-row input[type=range]{background:linear-gradient(var(--mu),var(--mu)) 0/var(--vpct,80%) 100% no-repeat var(--bd);height:3px}

    /* ── Pomodoro ── */
    .pom{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:20px 22px;margin-bottom:14px}
    .pom.run.focus{border-color:var(--yb)}
    .pom.run.brk{border-color:rgba(92,219,125,.3)}
    .pom-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .pom-phase{font:700 9px/1 var(--head);letter-spacing:.15em;text-transform:uppercase;color:var(--mu)}
    .pom.run.focus .pom-phase{color:var(--y)}
    .pom.run.brk .pom-phase{color:var(--gr)}
    .pom-sync{display:flex;align-items:center;gap:8px;font:400 10px/1 var(--mono);color:var(--mu);
              letter-spacing:.05em;cursor:pointer;user-select:none}
    .switch{width:34px;height:18px;border-radius:9px;background:var(--bd);position:relative;transition:background .15s;flex-shrink:0}
    .switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
                   background:var(--mu);transition:all .15s}
    .pom-sync.on .switch{background:var(--y)}
    .pom-sync.on .switch::after{background:#0e0e0e;left:18px}

    .pom-time{font:800 34px/1 var(--head);letter-spacing:.01em;text-align:center;margin:6px 0 4px;
              font-variant-numeric:tabular-nums}
    .pom-count{font:400 10px/1 var(--mono);color:var(--mu);letter-spacing:.06em;text-align:center;margin-bottom:18px}
    .pom-count em{color:var(--y);font-style:normal}
    .count-reset{background:none;border:none;color:var(--mu);font:400 9px/1 var(--mono);
                 letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-left:10px;
                 padding:2px 0;transition:color .12s}
    .count-reset:hover{color:var(--re)}

    .pom-controls{display:flex;gap:8px;margin-bottom:16px}
    .pom-btn{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:7px;color:var(--tx);
             font:700 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:13px;
             cursor:pointer;transition:all .12s}
    .pom-btn:hover{border-color:var(--y);color:var(--y)}
    .pom-btn.primary{background:var(--y);color:#0e0e0e;border-color:var(--y)}
    .pom-btn.primary:hover{opacity:.88;color:#0e0e0e}

    .pom-durs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .dur{background:var(--s2);border:1px solid var(--bd);border-radius:7px;padding:11px 12px;
         display:flex;align-items:center;justify-content:space-between;gap:10px}
    .dur-lbl{font:400 10px/1 var(--mono);color:var(--mu);letter-spacing:.05em}
    .dur-ctl{display:flex;align-items:center;gap:9px}
    .dur-step{background:none;border:none;color:var(--mu);font:700 15px/1 var(--mono);cursor:pointer;
              padding:2px 4px;transition:color .12s}
    .dur-step:hover{color:var(--y)}
    .dur-val{font:700 13px/1 var(--mono);color:var(--tx);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}

    /* ── Playlist ── */
    .pl-head{display:flex;align-items:center;justify-content:space-between;
             margin:24px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--bd)}
    .pl-title{font:700 10px/1 var(--head);letter-spacing:.15em;text-transform:uppercase;color:var(--y)}
    .pl-meta{font:400 10px/1 var(--mono);color:var(--mu);letter-spacing:.05em}

    .track{background:var(--s1);border:1px solid var(--bd);border-radius:7px;
           padding:13px 14px;margin-bottom:6px;display:flex;align-items:center;gap:13px;
           cursor:pointer;transition:all .1s;user-select:none}
    .track:hover{background:var(--s2)}
    .track.active{background:var(--yd);border-color:var(--y)}
    .tk-ico{width:26px;height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
            color:var(--mu)}
    .track.active .tk-ico{color:var(--y)}
    .tk-ico svg{width:16px;height:16px}
    /* animated bars when playing */
    .tk-bars{display:none;align-items:flex-end;gap:2px;height:14px}
    .track.active.playing .tk-ico svg{display:none}
    .track.active.playing .tk-bars{display:flex}
    .tk-bars span{width:2px;background:var(--y);border-radius:1px;animation:eq .9s ease-in-out infinite}
    .tk-bars span:nth-child(1){height:40%;animation-delay:-.2s}
    .tk-bars span:nth-child(2){height:90%;animation-delay:-.5s}
    .tk-bars span:nth-child(3){height:60%;animation-delay:0s}
    @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
    .tk-body{flex:1;min-width:0}
    .tk-name{font:400 13px/1.3 var(--mono);color:var(--tx);letter-spacing:.02em;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .track.active .tk-name{color:var(--y)}
    .tk-dur{font:400 10px/1 var(--mono);color:var(--mu);letter-spacing:.04em;margin-top:4px}
    .tk-del{background:none;border:none;color:var(--mu);font:400 14px/1 var(--mono);cursor:pointer;
            padding:5px 3px;flex-shrink:0;transition:color .12s}
    .tk-del:hover{color:var(--re)}

    /* empty state */
    .empty{text-align:center;padding:46px 20px;border:1px dashed var(--bd);border-radius:9px;
           background:var(--s1)}
    .empty-ico{color:var(--mu);margin-bottom:14px}
    .empty-ico svg{width:30px;height:30px}
    .empty-t{font:700 13px/1.4 var(--head);letter-spacing:.05em;color:var(--tx);margin-bottom:7px}
    .empty-s{font:400 11px/1.6 var(--mono);color:var(--mu);letter-spacing:.03em;max-width:340px;margin:0 auto 18px}
    .add-btn{background:var(--y);border:none;border-radius:7px;color:#0e0e0e;
             font:700 11px/1 var(--mono);letter-spacing:.07em;padding:13px 22px;cursor:pointer;transition:opacity .12s}
    .add-btn:hover{opacity:.88}

    /* toast */
    .toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;
           transform:translateX(-50%) translateY(120px);background:var(--y);color:#0e0e0e;
           font:700 11px/1 var(--mono);letter-spacing:.07em;padding:11px 20px;border-radius:6px;
           transition:transform .2s ease;z-index:99;pointer-events:none;white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}

    input[type=file]{display:none}

    /* ══ App chrome ══ */
    .titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
              padding:13px 16px 11px;-webkit-app-region:drag;flex-shrink:0}
    .tb-label{font:700 9px/1 var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
    .tb-logo{font:800 30px/1 var(--head);letter-spacing:-.02em}
    .tb-logo em{color:var(--y);font-style:normal}
    .win-ctl{display:flex;gap:3px;-webkit-app-region:no-drag}
    .wb{-webkit-app-region:no-drag;background:none;border:none;border-radius:6px;color:var(--mu);
        width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
    .wb svg{width:15px;height:15px}
    .wb:hover{background:var(--s2);color:var(--tx)}
    .wb.close:hover{background:var(--re);color:#fff}

    .views{flex:1;min-height:0;display:flex;flex-direction:column}
    .view{display:none;flex:1;min-height:0;flex-direction:column}
    .view.active{display:flex}
    .scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 18px 16px}

    .sect-row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 11px}
    .sect-lbl{font:700 9px/1 var(--head);letter-spacing:.15em;text-transform:uppercase;color:var(--mu)}

    .view[data-view=tracks] .pl-head{margin:8px 18px 0;padding-bottom:11px;justify-content:flex-start;gap:11px}
    .view[data-view=tracks] .pl-head .ghost-btn{margin-left:auto}
    .view[data-view=tracks] .scroll{padding-top:10px}

    .nav{display:flex;gap:6px;padding:10px 16px calc(13px + env(safe-area-inset-bottom));
         border-top:1px solid var(--bd);flex-shrink:0}
    .nav-btn{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:8px;color:var(--mu);
             font:700 10px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;
             padding:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .12s}
    .nav-btn svg{width:15px;height:15px}
    .nav-btn:hover{color:var(--tx);border-color:var(--mu)}
    .nav-btn.active{color:var(--y);border-color:var(--y);background:var(--yd)}

    /* ══ Mini player ══ */
    .mini{display:none}
    body.mini-mode .wrap{display:none}
    body.mini-mode .mini{display:flex;flex-direction:column;height:100vh;
         -webkit-app-region:drag;background:var(--bg);padding:11px 13px}
    .mini-main{display:flex;align-items:center;gap:11px;flex:1;min-height:0}
    .mini-play{-webkit-app-region:no-drag;background:var(--y);border:none;border-radius:50%;
         width:38px;height:38px;color:#0e0e0e;display:flex;align-items:center;justify-content:center;
         cursor:pointer;flex-shrink:0;transition:opacity .12s}
    .mini-play:hover{opacity:.88}
    .mini-play svg{width:18px;height:18px}
    .mini-info{flex:1;min-width:0;-webkit-app-region:drag}
    .mini-title{font:700 13px/1.2 var(--head);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini-sub{font:400 10px/1 var(--mono);color:var(--mu);margin-top:4px;letter-spacing:.04em}
    .mini-ctrl{-webkit-app-region:no-drag;background:none;border:none;color:var(--mu);cursor:pointer;
         width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;
         transition:all .12s;flex-shrink:0}
    .mini-ctrl:hover{color:var(--tx);background:var(--s2)}
    .mini-ctrl svg{width:17px;height:17px}
    .mini-pom{display:none;align-items:center;gap:9px;padding-top:9px;margin-top:9px;border-top:1px solid var(--bd)}
    .mini-dot{width:7px;height:7px;border-radius:50%;background:var(--y);flex-shrink:0}
    .mini.brk .mini-dot{background:var(--gr)}
    .mini-phase{font:700 9px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
    .mini.brk .mini-phase{color:var(--gr)}
    .mini-time{font:800 15px/1 var(--head);color:var(--tx);font-variant-numeric:tabular-nums;margin-left:auto}
    .mini-ctrl.sm{width:28px;height:28px}
    .mini-ctrl.sm svg{width:15px;height:15px}

    /* ══ Zen (fullscreen visualizer) ══ */
    .zen{display:none}
    body.zen-mode .wrap{display:none}
    body.zen-mode .zen{display:block;position:fixed;inset:0;background:var(--bg);overflow:hidden}
    body.zen-mode.hide-cursor{cursor:none}
    #zen-canvas{position:absolute;inset:0;width:100%;height:100%}
    .zen-exit{position:absolute;top:18px;right:18px;z-index:3;background:rgba(22,22,22,.72);
      border:1px solid var(--bd);border-radius:7px;color:var(--mu);font:400 10px/1 var(--mono);
      letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;cursor:pointer;
      display:flex;align-items:center;gap:8px;transition:all .15s}
    .zen-exit:hover{color:var(--tx);border-color:var(--mu)}
    .zen-exit svg{width:14px;height:14px}
    .zen-center{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;padding-bottom:12vh;pointer-events:none}
    .zen-center button{pointer-events:auto}
    .zen-phase{font:700 11px/1 var(--head);letter-spacing:.32em;text-transform:uppercase;
      color:var(--y);margin-bottom:20px}
    .zen.brk .zen-phase{color:var(--gr)}
    .zen-time{font:800 clamp(72px,15vw,160px)/1 var(--head);letter-spacing:.01em;
      font-variant-numeric:tabular-nums;color:var(--tx)}
    .zen-count{font:400 11px/1 var(--mono);color:var(--mu);letter-spacing:.08em;margin-top:20px}
    .zen-count em{color:var(--y);font-style:normal}
    .zen.brk .zen-count em{color:var(--gr)}
    .zen-pom-btn{margin-top:28px;background:none;border:1px solid var(--bd);border-radius:7px;
      color:var(--mu);font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
      padding:12px 24px;cursor:pointer;transition:all .15s}
    .zen-pom-btn:hover{border-color:var(--y);color:var(--y)}
    .zen-bottom{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;
      justify-content:space-between;gap:16px;padding:0 28px calc(24px + env(safe-area-inset-bottom))}
    .zen-track{font:700 16px/1.3 var(--head);color:var(--tx);max-width:46vw;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .zen-tt{font:400 10px/1 var(--mono);color:var(--mu);letter-spacing:.05em;margin-top:7px;
      font-variant-numeric:tabular-nums}
    .zen-ctrls{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .zen-exit,.zen-bottom{transition:opacity .35s}
    body.zen-mode.hide-cursor .zen-exit,body.zen-mode.hide-cursor .zen-bottom{opacity:0}
    .zen-viz-btn{position:absolute;top:18px;left:18px;z-index:3;background:rgba(22,22,22,.72);
      border:1px solid var(--bd);border-radius:7px;color:var(--mu);font:400 10px/1 var(--mono);
      letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;cursor:pointer;transition:all .15s}
    .zen-viz-btn:hover{color:var(--y);border-color:var(--y)}
    .zen-viz-btn{transition:opacity .35s,color .15s,border-color .15s}
    body.zen-mode.hide-cursor .zen-viz-btn{opacity:0}

    /* ══ Noise generator ══ */
    .noise{background:var(--s1);border:1px solid var(--bd);border-radius:10px;
      padding:16px 22px 18px;margin-bottom:14px}
    .noise-btns{display:flex;gap:8px}
    .nz{flex:1;background:var(--s2);border:1px solid var(--bd);border-radius:7px;color:var(--mu);
      font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:11px;
      cursor:pointer;transition:all .12s}
    .nz:hover{border-color:var(--y);color:var(--y)}
    .nz.on{background:var(--yd);border-color:var(--y);color:var(--y)}
    .noise .vol-row{margin-top:13px}

    /* ══ Goal dots ══ */
    .gdot{display:inline-block;width:7px;height:7px;border-radius:50%;
      border:1px solid var(--y);margin:0 2px;vertical-align:middle;opacity:.85}
    .gdot.f{background:var(--y)}
    .zen.brk .gdot{border-color:var(--gr)}
    .zen.brk .gdot.f{background:var(--gr)}

    /* ══ Break-track + reorder ══ */
    .tk-brk{background:none;border:none;color:var(--mu);cursor:pointer;padding:5px 3px;
      flex-shrink:0;transition:color .12s;opacity:.55}
    .tk-brk svg{width:15px;height:15px;display:block}
    .tk-brk:hover{color:var(--gr);opacity:1}
    .tk-brk.on{color:var(--gr);opacity:1}
    .track.drop-target{border-color:var(--y)}
    .track[draggable]{cursor:grab}
    .track.dragging{opacity:.4}

    /* ══ Drag-files overlay ══ */
    body.dropping::after{content:'drop audio files to add';position:fixed;inset:10px;z-index:200;
      display:flex;align-items:center;justify-content:center;border:2px dashed var(--y);
      border-radius:12px;background:rgba(14,14,14,.88);color:var(--y);
      font:700 13px/1 var(--head);letter-spacing:.15em;text-transform:uppercase;pointer-events:none}
  </style>
</head>
<body>
<div class="wrap">

  <!-- ═══ TITLE BAR (drag region + window controls) ═══ -->
  <div class="titlebar">
    <div>
      <div class="tb-label">Ambiance / Focus</div>
      <div class="tb-logo">FLOW<em>.</em></div>
    </div>
    <div class="win-ctl">
      <button class="wb" id="mini-btn" title="Miniplayer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4v6H4"/><path d="M14 20v-6h6"/><path d="M10 10L4 4"/><path d="M14 14l6 6"/></svg>
      </button>
      <button class="wb" id="win-min" title="Minimize">

<audio id="audio" preload="metadata"></audio>
<audio id="audio-b" preload="auto"></audio>
<div class="toast" id="toast"></div>

<script>
/* ════════════ IndexedDB (persist audio blobs) ════════════ */
const DB_NAME='flow_db', STORE='tracks';
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE,{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbPut(rec){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbAll(){const db=await openDB();return new Promise((res,rej)=>{const rq=db.transaction(STORE,'readonly').objectStore(STORE).getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function idbDel(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

/* ════════════ State ════════════ */
const ORDER_KEY='flow_order', SET_KEY='flow_settings';
let tracks=[];          // {id,name,url,duration}
let current=-1;         // index into tracks
let loopMode=0;         // 0 off · 1 all · 2 one
let shuffle=false;
let settings={focus:25,brk:5,longBrk:15,goal:4,sync:true,vol:80,pomOn:true,
              breakTrackId:null,noise:'off',noiseVol:40,zenViz:0};

const audioA=document.getElementById('audio');
const audioB=document.getElementById('audio-b');
let audio=audioA;   // active element — the other one is used for crossfades
const $=id=>document.getElementById(id);

function master(){ return settings.vol/100; }

/* volume fades (pomodoro transitions + loop crossfade) */
const fades=new Map();
function cancelFade(el){ const id=fades.get(el); if(id!==undefined){ clearInterval(id); fades.delete(el); } }
function fadeEl(el,target,ms,done){
  cancelFade(el);
  const v0=el.volume, t0=performance.now();
  const id=setInterval(()=>{
    const k=Math.min(1,(performance.now()-t0)/ms);
    el.volume=v0+(target-v0)*k;
    if(k>=1){ cancelFade(el); if(done) done(); }
  },32);
  fades.set(el,id);
}

function loadSettings(){ try{Object.assign(settings,JSON.parse(localStorage.getItem(SET_KEY)||'{}'));}catch{} }
function saveSettings(){ localStorage.setItem(SET_KEY,JSON.stringify(settings)); }
function saveOrder(){ localStorage.setItem(ORDER_KEY,JSON.stringify(tracks.map(t=>t.id))); }

function fmt(s){
  if(!isFinite(s)||s<0) s=0;
  s=Math.floor(s);
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  const mm=h?String(m).padStart(2,'0'):m;
  return (h?h+':':'')+mm+':'+String(sec).padStart(2,'0');
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stripExt(n){return n.replace(/\.[^.]+$/,'');}

/* ════════════ Library load / add ════════════ */
async function loadLibrary(){
  const recs=await idbAll();
  let order=[]; try{order=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');}catch{}
  const byId={}; recs.forEach(r=>byId[r.id]=r);
  const ordered=[...order.filter(id=>byId[id]), ...recs.filter(r=>!order.includes(r.id)).map(r=>r.id)];
  tracks=ordered.map(id=>{
    const r=byId[id];
    return {id, name:r.name, url:URL.createObjectURL(r.blob), duration:r.duration||0};
  });
  saveOrder();
  renderList();
  // probe missing durations lazily
  tracks.forEach(t=>{ if(!t.duration) probeDuration(t); });
}

function probeDuration(t){
  const a=new Audio(); a.preload='metadata'; a.src=t.url;
  a.addEventListener('loadedmetadata',async()=>{
    t.duration=a.duration; renderList();
    const recs=await idbAll(); const r=recs.find(x=>x.id===t.id);
    if(r){ r.duration=a.duration; idbPut(r); }
  },{once:true});
}

async function addFiles(fileList){
  const files=[...fileList].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|flac|ogg|wav|aac)$/i.test(f.name));
  if(!files.length){ toast('no audio files'); return; }
  for(const f of files){
    const id='t_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
    const rec={id, name:f.name, blob:f, duration:0, added:Date.now()};
    try{ await idbPut(rec); }
    catch(e){ toast('storage full — track skipped'); console.error(e); continue; }
    tracks.push({id, name:f.name, url:URL.createObjectURL(f), duration:0});
    probeDuration(tracks[tracks.length-1]);
  }
  saveOrder(); renderList();
  toast(files.length+' track'+(files.length>1?'s':'')+' added');
}

async function delTrack(id,ev){
  ev.stopPropagation();
  const i=tracks.findIndex(t=>t.id===id);
  if(i<0) return;
  if(settings.breakTrackId===id){ settings.breakTrackId=null; saveSettings(); }
  const wasCurrent=(i===current);
  URL.revokeObjectURL(tracks[i].url);
  await idbDel(id);
  tracks.splice(i,1);
  if(wasCurrent){ audio.pause(); audio.removeAttribute('src'); current=-1; updateNP(); }
  else if(i<current){ current--; }
  saveOrder(); renderList();
}

/* ════════════ Playback ════════════ */
let xfading=false;
function otherEl(){ return audio===audioA?audioB:audioA; }
function play(i){
  if(i<0||i>=tracks.length) return;
  current=i;
  xfading=false;
  const o=otherEl(); cancelFade(o); o.pause();
  cancelFade(audio);
  audio.volume=master();
  audio.src=tracks[i].url;
  audio.play().catch(()=>{});
  updateNP(); renderList();
}
/* gapless loop-one: overlap the tail with a fresh start on the spare element */
function maybeCrossfade(){
  if(loopMode!==2||xfading||current<0||!audio.duration) return;
  const rem=audio.duration-audio.currentTime;
  if(rem>1.2||rem<=0) return;
  xfading=true;
  const o=otherEl(), old=audio;
  o.src=tracks[current].url;
  o.currentTime=0; o.volume=0;
  o.play().then(()=>{
    audio=o;
    fadeEl(old,0,1000,()=>old.pause());
    fadeEl(o,master(),1000,()=>{ xfading=false; });
  }).catch(()=>{ xfading=false; });
}
function togglePlay(){
  if(current<0){ if(tracks.length) play(0); return; }
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}
function nextTrack(auto){
  if(!tracks.length) return;
  if(loopMode===2 && auto){ audio.currentTime=0; audio.play().catch(()=>{}); return; }
  if(shuffle){
    if(tracks.length===1){ if(auto&&loopMode!==1){audio.pause();return;} play(0); return; }
    let n; do{ n=Math.floor(Math.random()*tracks.length); }while(n===current);
    play(n); return;
  }
  if(current+1<tracks.length) play(current+1);
  else if(loopMode===1) play(0);
  else if(auto){ audio.pause(); audio.currentTime=audio.duration||0; renderList(); }
  else play(0);
}
function prevTrack(){
  if(!tracks.length) return;
  if(audio.currentTime>3){ audio.currentTime=0; return; }
  if(current-1>=0) play(current-1);
  else play(tracks.length-1);
}

function updateNP(){
  const t=tracks[current];
  $('np-title').textContent=t?stripExt(t.name):'—';
  $('np-sub').innerHTML=t?`track <em>${current+1}</em> of ${tracks.length}`:'select a track to begin';
  if('mediaSession' in navigator){
    try{ navigator.mediaSession.metadata=t?new MediaMetadata({title:stripExt(t.name),artist:'FLOW'}):null; }catch{}
  }
  updateTray();
  syncMini();
}
function updateTray(){
  if(!winAPI||!winAPI.setTray) return;
  const t=tracks[current];
  let s='FLOW';
  if(pom.running){
    const m=Math.floor(pom.remaining/60), ss=pom.remaining%60;
    s+=` · ${phaseLabel()} ${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  }
  if(t&&!audio.paused) s+=' · ♪ '+stripExt(t.name);
  winAPI.setTray(s);
}

/* play/pause icon + active-row bars */
function reflectPlayState(){
  const playing=!audio.paused && current>=0;
  $('play-ico').innerHTML = playing
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  document.querySelectorAll('.track').forEach((el,i)=>{
    el.classList.toggle('playing', i===current && playing);
  });
  if('mediaSession' in navigator){
    try{ navigator.mediaSession.playbackState=playing?'playing':'paused'; }catch{}
  }
  updateTray();
  syncMini();
}

/* ════════════ List render ════════════ */
function renderList(){
  $('pl-meta').textContent=tracks.length+' track'+(tracks.length===1?'':'s');
  const list=$('pl-list');
  if(!tracks.length){
    list.innerHTML=`<div class="empty">
      <div class="empty-ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
      <div class="empty-t">No tracks yet</div>
      <div class="empty-s">Add your ambiance &amp; focus mp3s from your PC. They're saved locally in this browser, so they'll be here next time.</div>
      <button class="add-btn" id="add-empty">+ add tracks</button>
    </div>`;
    $('add-empty').onclick=pickFiles;
    reflectPlayState();
    return;
  }
  list.innerHTML=tracks.map((t,i)=>`
    <div class="track${i===current?' active':''}" data-i="${i}" draggable="true">
      <div class="tk-ico">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        <div class="tk-bars"><span></span><span></span><span></span></div>
      </div>
      <div class="tk-body">
        <div class="tk-name">${esc(stripExt(t.name))}</div>
        <div class="tk-dur">${t.duration?fmt(t.duration):'—'}</div>
      </div>
      <button class="tk-brk${t.id===settings.breakTrackId?' on':''}" data-id="${t.id}" title="Play this during breaks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/></svg>
      </button>
      <button class="tk-del" data-id="${t.id}" title="Remove">✕</button>
    </div>`).join('');
  list.querySelectorAll('.track').forEach(el=>{
    el.onclick=()=>play(+el.dataset.i);
    el.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/flow-track',el.dataset.i);
      e.dataTransfer.effectAllowed='move';
      el.classList.add('dragging');
    });
    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    el.addEventListener('dragover',e=>{
      if(!e.dataTransfer.types.includes('text/flow-track')) return;
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      el.classList.add('drop-target');
    });
    el.addEventListener('dragleave',()=>el.classList.remove('drop-target'));
    el.addEventListener('drop',e=>{
      if(!e.dataTransfer.types.includes('text/flow-track')) return;
      e.preventDefault(); e.stopPropagation();
      el.classList.remove('drop-target');
      const from=+e.dataTransfer.getData('text/flow-track');
      let to=+el.dataset.i;
      if(from===to||isNaN(from)) return;
      const cur=tracks[current];
      const [moved]=tracks.splice(from,1);
      tracks.splice(to,0,moved);
      current=cur?tracks.indexOf(cur):-1;
      saveOrder(); renderList(); updateNP();
    });
  });
  list.querySelectorAll('.tk-brk').forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      settings.breakTrackId=settings.breakTrackId===b.dataset.id?null:b.dataset.id;
      saveSettings(); renderList();
      toast(settings.breakTrackId?'break track set':'break track cleared');
    };
  });
  list.querySelectorAll('.tk-del').forEach(b=>{
    b.onclick=e=>delTrack(b.dataset.id,e);
  });
  reflectPlayState();
}

/* ════════════ Pomodoro ════════════ */
let pom={running:false, phase:'focus', long:false, remaining:25*60, total:25*60, sessions:0, timer:null};
let resumeIdx=-1;   // track to come back to after a break-track swap
function pomTodayKey(){ return 'flow_pom_'+new Date().toISOString().slice(0,10); }
function loadPom(){ pom.sessions=+(localStorage.getItem(pomTodayKey())||0); setRemaining(settings.focus*60); }
function savePomSessions(){ localStorage.setItem(pomTodayKey(),pom.sessions); }
function setRemaining(sec){ pom.remaining=sec; pom.total=sec; }
function phaseLabel(){ return pom.phase==='focus'?'Focus':(pom.long?'Long break':'Break'); }
function goalDots(){
  if(!settings.goal) return '';
  let d='';
  for(let i=0;i<settings.goal;i++) d+=`<span class="gdot${i<pom.sessions?' f':''}"></span>`;
  return d+' ';
}

function renderPom(){
  const m=Math.floor(pom.remaining/60), s=pom.remaining%60;
  $('pom-time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  $('pom-phase').textContent='Pomodoro · '+phaseLabel();
  const cnt=settings.goal?`<em>${pom.sessions}</em>/${settings.goal} today`
                         :`<em>${pom.sessions}</em> session${pom.sessions===1?'':'s'} today`;
  $('pom-count').innerHTML=goalDots()+cnt;
  $('pom-start').textContent=pom.running?'Pause':'Start';
  const el=$('pom');
  el.classList.toggle('run',pom.running);
  el.classList.toggle('focus',pom.phase==='focus');
  el.classList.toggle('brk',pom.phase==='break');
  $('dur-focus').textContent=settings.focus+'m';
  $('dur-brk').textContent=settings.brk+'m';
  $('dur-long').textContent=settings.longBrk+'m';
  $('dur-goal').textContent=settings.goal||'off';
  if(winAPI&&winAPI.setProgress){
    if(pom.running) winAPI.setProgress(1-pom.remaining/pom.total, pom.phase==='focus'?'normal':'paused');
    else winAPI.setProgress(-1,'normal');
  }
  updateTray();
  syncMini();
}
function pomTick(){
  pom.remaining--;
  if(pom.remaining<=0) pomPhaseEnd();
  renderPom();
}
function pomStart(){
  if(pom.running){ pomPause(); return; }
  pom.running=true;
  pom.timer=setInterval(pomTick,1000);
  if(settings.sync && pom.phase==='focus' && current>=0 && audio.paused){
    audio.volume=0; audio.play().catch(()=>{}); fadeEl(audio,master(),1500);
  }
  renderPom();
}
function pomPause(){
  pom.running=false; clearInterval(pom.timer); renderPom();
}
function pomReset(){
  pomPause(); pom.phase='focus'; pom.long=false; setRemaining(settings.focus*60); renderPom();
}
function pomSkip(){ pomPhaseEnd(); }
function pomResetCount(){
  pom.sessions=0; savePomSessions(); renderPom(); toast('session count reset');
}
function reflectPomToggle(){
  $('pom').style.display = settings.pomOn ? '' : 'none';
  $('pom-toggle').classList.toggle('toggled', settings.pomOn);
  if(!settings.pomOn && pom.running) pomPause();
}

/* music + noise transitions on phase change (gentle fades, optional break track) */
function musicToBreak(){
  if(!settings.sync) return;
  noiseDuck(true);
  const bi=settings.breakTrackId?tracks.findIndex(t=>t.id===settings.breakTrackId):-1;
  if(bi>=0 && bi!==current){
    resumeIdx=current;
    fadeEl(audio,0,1200,()=>{ play(bi); audio.volume=0; fadeEl(audio,master(),1200); });
  } else if(current>=0 && !audio.paused){
    fadeEl(audio,0,1800,()=>audio.pause());
  }
}
function musicToFocus(){
  if(!settings.sync) return;
  noiseDuck(false);
  if(resumeIdx>=0 && resumeIdx<tracks.length && resumeIdx!==current){
    const back=resumeIdx; resumeIdx=-1;
    fadeEl(audio,0,1000,()=>{ play(back); audio.volume=0; fadeEl(audio,master(),1500); });
  } else if(current>=0){
    resumeIdx=-1;
    cancelFade(audio);
    if(audio.paused){ audio.volume=0; audio.play().catch(()=>{}); }
    fadeEl(audio,master(),1500);
  }
}
function notifyPhase(title,body){
  if(document.hasFocus()) return;
  try{ new Notification(title,{body,silent:true}); }catch{}
}
function pomPhaseEnd(){
  clearInterval(pom.timer);
  chime();
  if(pom.phase==='focus'){
    pom.sessions++; savePomSessions();
    pom.long=pom.sessions%4===0;   // every 4th session
    pom.phase='break';
    setRemaining((pom.long?settings.longBrk:settings.brk)*60);
    musicToBreak();
    const msg=pom.long?'Long break — you earned it':'Break time';
    toast('Focus done — '+msg.toLowerCase());
    notifyPhase('Focus done',msg+(settings.goal?` · ${pom.sessions}/${settings.goal} today`:''));
  } else {
    pom.phase='focus'; pom.long=false;
    setRemaining(settings.focus*60);
    musicToFocus();
    toast('Break over — back to focus');
    notifyPhase('Break over','Back to focus');
  }
  if(pom.running) pom.timer=setInterval(pomTick,1000);
  renderPom();
}

/* soft chime via WebAudio */
let actx=null;
function chime(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [880,1320].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(actx.destination);
      const t0=actx.currentTime+i*0.16;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(0.18,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.5);
      o.start(t0); o.stop(t0+0.5);
    });
  }catch{}
}

/* ════════════ Noise generator ════════════ */
let noiseSrc=null, noiseGain=null, noiseDucked=false;
function noiseBuf(type){
  const len=actx.sampleRate*4, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
  if(type==='white'){ for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
  else if(type==='brown'){ let l=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; l=(l+0.02*w)/1.02; d[i]=l*3.5; } }
  else { // rain ≈ pink noise (Kellet approx), lowpassed live
    let b0=0,b1=0,b2=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1;
      b0=0.997*b0+0.0299*w; b1=0.985*b1+0.0563*w; b2=0.95*b2+0.115*w;
      d[i]=(b0+b1+b2+w*0.1849)*0.6; }
  }
  return buf;
}
function noiseTarget(){ return (noiseDucked?0:1)*(settings.noiseVol/100)*0.5; }
function applyNoiseGain(ms){
  if(!noiseGain||!actx) return;
  const t=actx.currentTime;
  noiseGain.gain.cancelScheduledValues(t);
  noiseGain.gain.setValueAtTime(noiseGain.gain.value,t);
  noiseGain.gain.linearRampToValueAtTime(noiseTarget(),t+(ms||300)/1000);
}
function noiseDuck(on){ noiseDucked=on; if(settings.noise!=='off') applyNoiseGain(1500); }
function setNoise(type){
  settings.noise=type; saveSettings(); reflectNoise();
  if(noiseSrc){ try{noiseSrc.stop();}catch{} try{noiseSrc.disconnect();}catch{} noiseSrc=null; }
  if(type==='off') return;
  ensureGraph();
  if(!actx||!analyser) return;
  if(!noiseGain){ noiseGain=actx.createGain(); noiseGain.gain.value=0; noiseGain.connect(analyser); }
  noiseSrc=actx.createBufferSource();
  noiseSrc.buffer=noiseBuf(type);
  noiseSrc.loop=true;
  if(type==='rain'){
    const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    noiseSrc.connect(f); f.connect(noiseGain);
  } else noiseSrc.connect(noiseGain);
  noiseSrc.start();
  applyNoiseGain(400);
}
function reflectNoise(){
  document.querySelectorAll('.nz').forEach(b=>b.classList.toggle('on',b.dataset.n===settings.noise));
}

/* ════════════ Zen (fullscreen visualizer) ════════════ */
let zenOn=false, zenRaf=0, analyser=null, zenData=null, zenCtx=null, zenW=0, zenH=0, cursorT=null;
const zenCache={};
const ZEN_M=15;                          // spectrum bands feeding the waves
const zenBands=new Float32Array(ZEN_M);  // temporally smoothed
let zenGlow=0;                           // smoothed bass energy → orb

function ensureGraph(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    if(!analyser){
      // sources can only be created once per <audio> element — afterwards all audio routes through the context
      analyser=actx.createAnalyser();
      analyser.fftSize=256;
      analyser.smoothingTimeConstant=.82;
      actx.createMediaElementSource(audioA).connect(analyser);
      actx.createMediaElementSource(audioB).connect(analyser);
      analyser.connect(actx.destination);
      zenData=new Uint8Array(analyser.frequencyBinCount);
    }
  }catch(e){ console.error('audio graph failed',e); }
}

function sizeZen(){
  const cv=$('zen-canvas'), dpr=window.devicePixelRatio||1;
  zenW=cv.clientWidth; zenH=cv.clientHeight;
  cv.width=Math.round(zenW*dpr); cv.height=Math.round(zenH*dpr);
  zenCtx=cv.getContext('2d');
  zenCtx.setTransform(dpr,0,0,dpr,0,0);
}

function enterZen(){
  if(zenOn) return;
  if(miniOn) exitMini();
  ensureGraph();
  zenOn=true;
  document.body.classList.add('zen-mode');
  if(winAPI) winAPI.setFullscreen(true);
  else document.documentElement.requestFullscreen?.().catch(()=>{});
  requestAnimationFrame(sizeZen);   // real size lands after the resize event; this covers the first frames
  zenRaf=requestAnimationFrame(zenFrame);
  wakeCursor();
}
function exitZenUI(){
  if(!zenOn) return;
  zenOn=false;
  cancelAnimationFrame(zenRaf);
  clearTimeout(cursorT);
  document.body.classList.remove('zen-mode','hide-cursor');
}
function exitZen(){
  exitZenUI();
  if(winAPI) winAPI.setFullscreen(false);
  else if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function wakeCursor(){
  document.body.classList.remove('hide-cursor');
  clearTimeout(cursorT);
  cursorT=setTimeout(()=>{ if(zenOn) document.body.classList.add('hide-cursor'); },2600);
}

function zSet(id,val,html){
  if(zenCache[id]===val) return;
  zenCache[id]=val;
  if(html) $(id).innerHTML=val; else $(id).textContent=val;
}

const ZEN_VIZ=['waves','ring','drift'];
let zenParts=null;
function cycleZenViz(){
  settings.zenViz=(settings.zenViz+1)%ZEN_VIZ.length;
  saveSettings();
  $('zen-viz-btn').textContent=ZEN_VIZ[settings.zenViz];
}

function zenFrame(){
  if(!zenOn) return;
  /* ── session + track info ── */
  const idle=!pom.running && pom.remaining===pom.total;
  if(idle){
    const now=new Date();
    zSet('zen-time',String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'));
    zSet('zen-phase',now.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}));
  } else {
    const m=Math.floor(pom.remaining/60), s=pom.remaining%60;
    zSet('zen-time',String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'));
    zSet('zen-phase',phaseLabel()+(pom.running?'':' · paused'));
  }
  const cnt=settings.goal?`<em>${pom.sessions}</em>/${settings.goal} today`
                         :`<em>${pom.sessions}</em> session${pom.sessions===1?'':'s'} today`;
  zSet('zen-count',goalDots()+cnt,true);
  zSet('zen-pom-btn',pom.running?'pause':(pom.phase==='focus'?'start focus':'start break'));
  $('zen').classList.toggle('brk',pom.phase==='break');
  const t=tracks[current], playing=!audio.paused&&current>=0;
  zSet('zen-track',t?stripExt(t.name):'—');
  zSet('zen-tt',t?fmt(audio.currentTime)+' / '+fmt(audio.duration||t.duration||0):'no track');
  const ico=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  zSet('zen-play-ico',ico,true);

  /* ── visualizer ── */
  if(zenCtx){
    if(analyser) analyser.getByteFrequencyData(zenData);
    const W=zenW, H=zenH;
    zenCtx.clearRect(0,0,W,H);
    const usable=zenData?Math.floor(zenData.length*0.7):0;
    let bass=0;
    for(let i=0;i<ZEN_M;i++){
      let v=0;
      if(usable){
        const a=Math.floor(i/ZEN_M*usable), b=Math.max(a+1,Math.floor((i+1)/ZEN_M*usable));
        for(let j=a;j<b;j++) v+=zenData[j];
        v/=(b-a)*255;
      }
      zenBands[i]+=(v-zenBands[i])*(v>zenBands[i]?0.25:0.06);  // fast attack, slow release
    }
    if(usable){ for(let j=0;j<6;j++) bass+=zenData[j]; bass/=6*255; }
    zenGlow+=(bass-zenGlow)*0.07;
    const col=pom.phase==='break'?'92,219,125':'167,139,250';
    const tm=performance.now()/1000;
    const cx=W/2, cy=H*0.44;

    // soft orb breathing with the bass, behind the timer (all modes)
    const r=Math.min(W,H)*(0.20+zenGlow*0.26);
    const g=zenCtx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,`rgba(${col},${(0.10+zenGlow*0.30).toFixed(3)})`);
    g.addColorStop(1,`rgba(${col},0)`);
    zenCtx.fillStyle=g;
    zenCtx.fillRect(cx-r,cy-r,r*2,r*2);

    const mode=ZEN_VIZ[settings.zenViz]||'waves';
    if(mode==='ring') drawRing(W,H,cx,cy,col,tm);
    else if(mode==='drift') drawDrift(W,H,col,tm);
    else drawWaves(W,H,col,tm);
  }
  zenRaf=requestAnimationFrame(zenFrame);
}

/* three flowing curves along the bottom, mirrored so bass swells in the middle */
function drawWaves(W,H,col,tm){
  const P=29, c=(P-1)/2, xs=new Array(P), ys=new Array(P);
  for(let L=0;L<3;L++){
    const amp=H*(0.34-L*0.09), alpha=[0.28,0.15,0.08][L], drift=tm*(0.5+L*0.35);
    for(let i=0;i<P;i++){
      const v=zenBands[Math.min(ZEN_M-1,Math.abs(i-c))];
      xs[i]=i/(P-1)*W;
      ys[i]=H-(0.03+v*v)*amp+Math.sin(drift+i*0.55+L*2.1)*H*0.012*(0.4+v*2);
    }
    zenCtx.beginPath();
    zenCtx.moveTo(0,H);
    zenCtx.lineTo(xs[0],ys[0]);
    for(let i=1;i<P-1;i++)
      zenCtx.quadraticCurveTo(xs[i],ys[i],(xs[i]+xs[i+1])/2,(ys[i]+ys[i+1])/2);
    zenCtx.lineTo(xs[P-1],ys[P-1]);
    zenCtx.lineTo(W,H);
    zenCtx.closePath();
    zenCtx.fillStyle=`rgba(${col},${alpha})`;
    zenCtx.fill();
  }
}

/* organic ring orbiting the timer, radius riding the spectrum */
function drawRing(W,H,cx,cy,col,tm){
  const K=96, R0=Math.min(W,H)*0.27, xs=new Array(K), ys=new Array(K);
  for(let k=0;k<K;k++){
    const mir=Math.abs(((k+K/2)%K)-K/2)/(K/2);   // mirror so left/right match
    const v=zenBands[Math.min(ZEN_M-1,Math.round(mir*(ZEN_M-1)))];
    const ang=(k/K)*Math.PI*2-Math.PI/2+Math.sin(tm*0.15)*0.3;
    const rr=R0*(1+v*v*0.85)+Math.sin(tm*0.8+k*0.4)*3;
    xs[k]=cx+Math.cos(ang)*rr; ys[k]=cy+Math.sin(ang)*rr;
  }
  zenCtx.beginPath();
  zenCtx.moveTo((xs[K-1]+xs[0])/2,(ys[K-1]+ys[0])/2);
  for(let k=0;k<K;k++){
    const x2=xs[(k+1)%K], y2=ys[(k+1)%K];
    zenCtx.quadraticCurveTo(xs[k],ys[k],(xs[k]+x2)/2,(ys[k]+y2)/2);
  }
  zenCtx.closePath();
  zenCtx.fillStyle=`rgba(${col},0.05)`;
  zenCtx.fill();
  zenCtx.strokeStyle=`rgba(${col},0.55)`;
  zenCtx.lineWidth=1.6;
  zenCtx.stroke();
}

/* slow particle field drifting upward, energized by the music */
function drawDrift(W,H,col,tm){
  if(!zenParts){
    zenParts=[];
    for(let i=0;i<90;i++) zenParts.push({
      x:Math.random(), y:Math.random(), r:1+Math.random()*2.5,
      sp:0.2+Math.random()*0.6, band:Math.floor(Math.random()*ZEN_M), ph:Math.random()*6.2832
    });
  }
  for(const p of zenParts){
    const v=zenBands[p.band];
    p.y-=p.sp*(0.0006+v*0.004);
    p.x+=Math.sin(tm*0.4+p.ph)*0.0004;
    if(p.y<-0.03){ p.y=1.03; p.x=Math.random(); }
    if(p.x<-0.03) p.x=1.03; else if(p.x>1.03) p.x=-0.03;
    zenCtx.beginPath();
    zenCtx.arc(p.x*W,p.y*H,p.r*(0.7+v*1.6),0,6.2832);
    zenCtx.fillStyle=`rgba(${col},${(0.06+v*0.5).toFixed(3)})`;
    zenCtx.fill();
  }
}

  $('zen').addEventListener('mousemove',()=>{ if(zenOn) wakeCursor(); });
  window.addEventListener('resize',()=>{ if(zenOn) sizeZen(); });
  if(winAPI && winAPI.onFullscreen) winAPI.onFullscreen(on=>{ if(!on) exitZenUI(); });

  loadSettings();
  // volume
  audioA.volume=audioB.volume=master();
  $('vol').value=settings.vol;
  $('vol').style.setProperty('--vpct',settings.vol+'%');

  $('add-top').onclick=pickFiles;
  $('file-input').onchange=e=>{ addFiles(e.target.files); e.target.value=''; };

  $('play-btn').onclick=togglePlay;
  $('prev-btn').onclick=prevTrack;
  $('next-btn').onclick=()=>nextTrack(false);
  $('loop-btn').onclick=()=>{ loopMode=(loopMode+1)%3; reflectLoop(); };
  $('shuffle-btn').onclick=()=>{ shuffle=!shuffle; reflectShuffle(); };

  // seek
  const seek=$('seek');
  let seeking=false;
  seek.addEventListener('input',()=>{ seeking=true;
    if(audio.duration){ const t=(seek.value/1000)*audio.duration; $('t-cur').textContent=fmt(t);
      seek.style.setProperty('--pct',(seek.value/10)+'%'); }
  });
  seek.addEventListener('change',()=>{ if(audio.duration) audio.currentTime=(seek.value/1000)*audio.duration; seeking=false; });

  // volume control
  $('vol').addEventListener('input',e=>{
    const v=+e.target.value; settings.vol=v; saveSettings();
    cancelFade(audio); audio.volume=master();
    e.target.style.setProperty('--vpct',v+'%');
  });

  // audio events — attached to BOTH elements; guards keep the inactive one quiet
  for(const el of [audioA,audioB]){
    el.addEventListener('timeupdate',e=>{
      if(e.target!==audio) return;
      maybeCrossfade();
      if(!audio.duration) return;
      if(!seeking){
        const p=(audio.currentTime/audio.duration)*1000;
        seek.value=p; seek.style.setProperty('--pct',(p/10)+'%');
      }
      $('t-cur').textContent=fmt(audio.currentTime);
    });
    el.addEventListener('loadedmetadata',e=>{ if(e.target===audio) $('t-dur').textContent=fmt(audio.duration); });
    el.addEventListener('play',reflectPlayState);
    el.addEventListener('pause',reflectPlayState);
    el.addEventListener('ended',e=>{ if(e.target===audio) nextTrack(true); });
  }

  // media keys (Windows SMTC)
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play',togglePlay);
      navigator.mediaSession.setActionHandler('pause',togglePlay);
      navigator.mediaSession.setActionHandler('previoustrack',prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack',()=>nextTrack(false));
    }catch{}
  }
  if(winAPI&&winAPI.onMedia) winAPI.onMedia(act=>{ act==='next'?nextTrack(false):togglePlay(); });

  // noise generator
  document.querySelectorAll('.nz').forEach(b=>{ b.onclick=()=>setNoise(b.dataset.n); });
  $('noise-vol').value=settings.noiseVol;
  $('noise-vol').style.setProperty('--vpct',settings.noiseVol+'%');
  $('noise-vol').addEventListener('input',e=>{
    settings.noiseVol=+e.target.value; saveSettings();
    e.target.style.setProperty('--vpct',settings.noiseVol+'%');
    applyNoiseGain(120);
  });
  reflectNoise();
  if(settings.noise!=='off') setNoise(settings.noise);

  // drop audio files anywhere to add them
  document.addEventListener('dragover',e=>{
    if(e.dataTransfer&&e.dataTransfer.types.includes('Files')){
      e.preventDefault(); document.body.classList.add('dropping');
    }
  });
  document.addEventListener('dragleave',e=>{
    if(!e.relatedTarget) document.body.classList.remove('dropping');
  });
  document.addEventListener('drop',e=>{
    document.body.classList.remove('dropping');
    if(e.dataTransfer&&e.dataTransfer.files.length){
      e.preventDefault();
      addFiles(e.dataTransfer.files);
    }
  });

  // pomodoro
  $('pom-start').onclick=pomStart;
  $('pom-reset').onclick=pomReset;
  $('pom-skip').onclick=pomSkip;
  $('pom-count-reset').onclick=pomResetCount;
  $('pom-toggle').onclick=()=>{ settings.pomOn=!settings.pomOn; saveSettings(); reflectPomToggle(); };
  $('pom-sync').onclick=()=>{ settings.sync=!settings.sync; saveSettings(); $('pom-sync').classList.toggle('on',settings.sync); };
  $('pom-sync').classList.toggle('on',settings.sync);
  const durCfg={focus:[1,180],brk:[1,60],longBrk:[5,90],goal:[0,20]};
  document.querySelectorAll('.dur-step').forEach(b=>{
    b.onclick=()=>{
      const key=b.dataset.d, [lo,hi]=durCfg[key], step=+b.dataset.s;
      settings[key]=Math.max(lo,Math.min(hi,settings[key]+step));
      saveSettings();
      if(!pom.running){
        if(key==='focus'&&pom.phase==='focus') setRemaining(settings.focus*60);
        if(key==='brk'&&pom.phase==='break'&&!pom.long) setRemaining(settings.brk*60);
        if(key==='longBrk'&&pom.phase==='break'&&pom.long) setRemaining(settings.longBrk*60);
      }
      renderPom();
    };
  });

  // keyboard: space = play/pause · F = zen · V = visualizer style · Esc = exit zen
  document.addEventListener('keydown',e=>{
    if(e.code==='Space' && e.target.tagName!=='INPUT'){ e.preventDefault(); togglePlay(); }
    else if(e.key==='Escape' && zenOn) exitZen();
    else if((e.key==='f'||e.key==='F') && e.target.tagName!=='INPUT'){ zenOn?exitZen():enterZen(); }
    else if((e.key==='v'||e.key==='V') && zenOn) cycleZenViz();
  });

  reflectLoop(); reflectShuffle();
  loadPom(); renderPom(); reflectPomToggle();
  loadLibrary();
}
init();
</script>
</body>
</html>
